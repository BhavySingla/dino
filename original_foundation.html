<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>

    <style>
        /* =========================================================
           RESET & PAGE
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* =========================================================
           GAME CONTAINER
        ========================================================= */

        #gameWrapper {
            position: relative;
            width: min(100vw, 1100px);
            height: min(100vh, 500px);
            overflow: hidden;
            background: #f7f7f7;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #f7f7f7;
            touch-action: none;
        }

        /* =========================================================
           UI
        ========================================================= */

        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        #score {
            position: absolute;
            top: 18px;
            right: 22px;

            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;

            color: #555;
        }

        #highScore {
            margin-right: 18px;
        }

        .screen {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: rgba(247, 247, 247, 0.93);

            pointer-events: auto;
        }

        .screen.hidden {
            display: none;
        }

        .screen h1 {
            font-size: clamp(35px, 7vw, 70px);
            color: #333;
            margin-bottom: 12px;
        }

        .screen h2 {
            font-size: clamp(25px, 5vw, 45px);
            color: #333;
            margin-bottom: 10px;
        }

        .screen p {
            color: #666;
            font-size: 16px;
            margin: 5px 0;
        }

        .screen button {
            margin-top: 25px;

            border: 2px solid #333;
            background: #fff;

            padding: 12px 28px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            border-radius: 6px;
        }

        .screen button:hover {
            background: #333;
            color: white;
        }

        #pauseIndicator {
            position: absolute;
            top: 55px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 14px;
            color: #888;

            display: none;
        }

        #pauseIndicator.visible {
            display: block;
        }

        /* Small-screen adjustments */
        @media (max-width: 600px) {
            #score {
                font-size: 15px;
                top: 12px;
                right: 12px;
            }

            #highScore {
                margin-right: 10px;
            }
        }
    </style>
</head>

<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>

    <div id="ui">

        <div id="score">
            <span id="highScore">HI 00000</span>
            <span id="currentScore">00000</span>
        </div>

        <div id="pauseIndicator">
            PAUSED — Press P to resume
        </div>

        <!-- START SCREEN -->
        <div id="startScreen" class="screen">

            <h1>🐊 DINO RUN</h1>

            <p>Jump over the cacti and survive as long as possible!</p>
            <p>SPACE / ↑ / TAP to jump</p>

            <button id="startButton">
                START GAME
            </button>

        </div>

        <!-- GAME OVER SCREEN -->
        <div id="gameOverScreen" class="screen hidden">

            <h2>GAME OVER</h2>

            <p id="finalScore">
                Score: 0
            </p>

            <p id="finalHighScore">
                High Score: 0
            </p>

            <button id="restartButton">
                RESTART
            </button>

            <p style="margin-top: 15px;">
                Press R to restart
            </p>

        </div>

    </div>

</div>


<script>
/* ================================================================
   DINO RUNNER
   ---------------------------------------------------------------
   Everything is contained in this single file.

   Main systems:
   1. Canvas rendering
   2. Game loop
   3. Player physics
   4. Obstacle generation
   5. Collision detection
   6. Increasing difficulty
   7. Score / high score
   8. Keyboard + touch controls
   9. Web Audio sound effects
================================================================ */


/* ================================================================
   CANVAS SETUP
================================================================ */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const wrapper = document.getElementById("gameWrapper");

let WIDTH = 1000;
let HEIGHT = 500;

function resizeCanvas() {

    const rect = wrapper.getBoundingClientRect();

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    WIDTH = rect.width;
    HEIGHT = rect.height;

    canvas.width = WIDTH * dpr;
    canvas.height = HEIGHT * dpr;

    canvas.style.width = WIDTH + "px";
    canvas.style.height = HEIGHT + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


/* ================================================================
   DOM ELEMENTS
================================================================ */

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOverScreen");

const startButton = document.getElementById("startButton");
const restartButton = document.getElementById("restartButton");

const currentScoreElement =
    document.getElementById("currentScore");

const highScoreElement =
    document.getElementById("highScore");

const finalScoreElement =
    document.getElementById("finalScore");

const finalHighScoreElement =
    document.getElementById("finalHighScore");

const pauseIndicator =
    document.getElementById("pauseIndicator");


/* ================================================================
   CONSTANTS
================================================================ */

const GROUND_HEIGHT = 75;

const GRAVITY = 2200;

const JUMP_FORCE = -760;

const INITIAL_SPEED = 350;

const MAX_SPEED = 850;

const SPEED_INCREASE = 8;

const DINO_WIDTH = 52;

const DINO_HEIGHT = 55;


/* ================================================================
   GAME STATE
================================================================ */

const GAME_STATE = {
    READY: "ready",
    RUNNING: "running",
    GAME_OVER: "gameover"
};

let gameState = GAME_STATE.READY;

let paused = false;

let lastTime = 0;

let gameTime = 0;

let score = 0;

let highScore =
    Number(localStorage.getItem("dinoHighScore")) || 0;

let gameSpeed = INITIAL_SPEED;


/* ================================================================
   PLAYER
================================================================ */

const player = {

    x: 80,

    y: 0,

    width: DINO_WIDTH,

    height: DINO_HEIGHT,

    velocityY: 0,

    grounded: false,

    ducking: false,

    reset() {

        this.x = Math.max(40, WIDTH * 0.08);

        this.y =
            HEIGHT - GROUND_HEIGHT - this.height;

        this.velocityY = 0;

        this.grounded = true;

        this.ducking = false;
    },

    jump() {

        if (!this.grounded || gameState !== GAME_STATE.RUNNING)
            return;

        this.velocityY = JUMP_FORCE;

        this.grounded = false;

        playJumpSound();
    },

    update(dt) {

        this.velocityY += GRAVITY * dt;

        this.y += this.velocityY * dt;

        const groundY =
            HEIGHT - GROUND_HEIGHT - this.height;

        if (this.y >= groundY) {

            this.y = groundY;

            this.velocityY = 0;

            this.grounded = true;
        }
    },

    draw() {

        ctx.save();

        ctx.translate(this.x, this.y);

        /*
            Simple pixel-style dinosaur.
            Change these rectangles to customize
            the player's appearance.
        */

        ctx.fillStyle = "#333";

        // Body
        ctx.fillRect(8, 18, 32, 28);

        // Head
        ctx.fillRect(27, 5, 25, 25);

        // Snout
        ctx.fillRect(45, 15, 12, 12);

        // Tail
        ctx.fillRect(0, 26, 12, 8);
        ctx.fillRect(4, 21, 7, 7);

        // Legs
        ctx.fillRect(13, 43, 8, 12);
        ctx.fillRect(31, 43, 8, 12);

        // Arms
        ctx.fillRect(37, 28, 13, 5);

        // Eye
        ctx.fillStyle = "#fff";
        ctx.fillRect(44, 10, 4, 4);

        ctx.fillStyle = "#333";
        ctx.fillRect(46, 11, 2, 2);

        ctx.restore();
    },

    getHitbox() {

        return {

            x: this.x + 7,

            y: this.y + 5,

            width: this.width - 12,

            height: this.height - 8
        };
    }
};


/* ================================================================
   OBSTACLES
================================================================ */

let obstacles = [];

let obstacleTimer = 0;

let nextObstacleTime = 1.2;


/*
    Random spacing is calculated here.

    As speed increases, spacing is adjusted so that
    the game remains challenging without becoming
    impossible.
*/

function getNextObstacleDelay() {

    const minimum =
        Math.max(0.75, 1.25 - gameSpeed / 1800);

    const maximum =
        Math.max(1.2, 2.1 - gameSpeed / 1600);

    return random(minimum, maximum);
}


/*
    Create a new cactus.
*/

function spawnObstacle() {

    const type = Math.random();

    let width;
    let height;

    if (type < 0.65) {

        // Small cactus
        width = random(25, 35);
        height = random(40, 58);

    } else if (type < 0.9) {

        // Tall cactus
        width = random(28, 40);
        height = random(58, 78);

    } else {

        // Wide cactus
        width = random(48, 65);
        height = random(42, 62);
    }

    obstacles.push({

        x: WIDTH + 20,

        y:
            HEIGHT -
            GROUND_HEIGHT -
            height,

        width,

        height,

        passed: false,

        type:
            type < 0.65
                ? "small"
                : type < 0.9
                    ? "tall"
                    : "wide"
    });
}


/*
    Update all obstacles.
*/

function updateObstacles(dt) {

    obstacleTimer += dt;

    if (obstacleTimer >= nextObstacleTime) {

        spawnObstacle();

        obstacleTimer = 0;

        nextObstacleTime =
            getNextObstacleDelay();
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const obstacle = obstacles[i];

        obstacle.x -= gameSpeed * dt;

        /*
            Score when player successfully passes
            an obstacle.
        */

        if (
            !obstacle.passed &&
            obstacle.x + obstacle.width < player.x
        ) {

            obstacle.passed = true;

            score += 10;
        }

        if (obstacle.x + obstacle.width < -50) {

            obstacles.splice(i, 1);
        }
    }
}


/*
    Draw cactus.
*/

function drawObstacle(obstacle) {

    ctx.save();

    ctx.translate(obstacle.x, obstacle.y);

    ctx.fillStyle = "#2f6b3c";

    /*
        Main cactus body
    */

    ctx.fillRect(
        obstacle.width * 0.35,
        0,
        obstacle.width * 0.3,
        obstacle.height
    );

    /*
        Cactus arms
    */

    if (obstacle.type !== "small") {

        const armY =
            obstacle.height * 0.35;

        // Left arm
        ctx.fillRect(
            obstacle.width * 0.05,
            armY,
            obstacle.width * 0.3,
            8
        );

        ctx.fillRect(
            obstacle.width * 0.05,
            armY - 15,
            8,
            23
        );

        // Right arm
        ctx.fillRect(
            obstacle.width * 0.65,
            armY + 15,
            obstacle.width * 0.3,
            8
        );

        ctx.fillRect(
            obstacle.width * 0.87,
            armY,
            8,
            23
        );
    }

    ctx.restore();
}


/* ================================================================
   COLLISION DETECTION
================================================================ */

function rectanglesOverlap(a, b) {

    return (

        a.x < b.x + b.width &&

        a.x + a.width > b.x &&

        a.y < b.y + b.height &&

        a.y + a.height > b.y

    );
}


function checkCollisions() {

    const playerBox =
        player.getHitbox();

    for (const obstacle of obstacles) {

        const obstacleBox = {

            x: obstacle.x + 4,

            y: obstacle.y + 3,

            width: obstacle.width - 8,

            height: obstacle.height - 5
        };

        if (
            rectanglesOverlap(
                playerBox,
                obstacleBox
            )
        ) {

            endGame();

            return;
        }
    }
}


/* ================================================================
   GROUND
================================================================ */

let groundOffset = 0;

function updateGround(dt) {

    groundOffset +=
        gameSpeed * dt;

    if (groundOffset > 30) {

        groundOffset -= 30;
    }
}


function drawGround() {

    const groundY =
        HEIGHT - GROUND_HEIGHT;

    ctx.strokeStyle = "#555";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(0, groundY);

    ctx.lineTo(WIDTH, groundY);

    ctx.stroke();

    /*
        Scrolling ground marks
    */

    ctx.fillStyle = "#777";

    for (
        let x = -groundOffset;
        x < WIDTH;
        x += 30
    ) {

        ctx.fillRect(
            x,
            groundY + 15,
            15,
            2
        );
    }

    /*
        Small random-looking ground dots
    */

    for (
        let x = -groundOffset * 0.5;
        x < WIDTH;
        x += 83
    ) {

        ctx.fillRect(
            x,
            groundY + 32,
            3,
            2
        );
    }
}


/* ================================================================
   BACKGROUND
================================================================ */

let cloudOffset = 0;

const clouds = [

    {
        x: 100,
        y: 75,
        width: 70
    },

    {
        x: 420,
        y: 120,
        width: 90
    },

    {
        x: 760,
        y: 65,
        width: 60
    }
];


function updateBackground(dt) {

    cloudOffset +=
        gameSpeed * 0.08 * dt;

    for (const cloud of clouds) {

        cloud.x -=
            gameSpeed * 0.08 * dt;

        if (cloud.x + cloud.width < 0) {

            cloud.x =
                WIDTH + random(50, 250);

            cloud.y =
                random(50, 150);
        }
    }
}


function drawCloud(cloud) {

    ctx.fillStyle = "#ddd";

    ctx.beginPath();

    ctx.arc(
        cloud.x,
        cloud.y,
        cloud.width * 0.2,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + cloud.width * 0.25,
        cloud.y - 10,
        cloud.width * 0.27,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cloud.x + cloud.width * 0.55,
        cloud.y,
        cloud.width * 0.2,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


function drawBackground() {

    // Sky
    ctx.fillStyle = "#f7f7f7";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    // Clouds
    for (const cloud of clouds) {

        drawCloud(cloud);
    }

    /*
        Very subtle distant hills
    */

    ctx.fillStyle = "#ededed";

    ctx.beginPath();

    ctx.moveTo(0, HEIGHT - GROUND_HEIGHT - 50);

    for (
        let x = 0;
        x <= WIDTH;
        x += 80
    ) {

        const y =
            HEIGHT -
            GROUND_HEIGHT -
            50 -
            Math.sin(x * 0.015) * 25;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(WIDTH, HEIGHT - GROUND_HEIGHT);

    ctx.lineTo(0, HEIGHT - GROUND_HEIGHT);

    ctx.closePath();

    ctx.fill();
}


/* ================================================================
   SCORE
================================================================ */

function updateScore() {

    currentScoreElement.textContent =
        String(Math.floor(score))
            .padStart(5, "0");

    highScoreElement.textContent =
        "HI " +
        String(highScore)
            .padStart(5, "0");
}


function updateHighScore() {

    const current =
        Math.floor(score);

    if (current > highScore) {

        highScore = current;

        localStorage.setItem(
            "dinoHighScore",
            highScore
        );
    }
}


/* ================================================================
   GAME SPEED
================================================================ */

function updateDifficulty(dt) {

    gameTime += dt;

    gameSpeed =
        Math.min(
            MAX_SPEED,
            INITIAL_SPEED +
            gameTime * SPEED_INCREASE
        );
}


/* ================================================================
   GAME RESET
================================================================ */

function resetGame() {

    obstacles = [];

    obstacleTimer = 0;

    nextObstacleTime = 1.2;

    gameTime = 0;

    score = 0;

    gameSpeed = INITIAL_SPEED;

    groundOffset = 0;

    player.reset();

    updateScore();
}


/* ================================================================
   START GAME
================================================================ */

function startGame() {

    resetGame();

    gameState =
        GAME_STATE.RUNNING;

    paused = false;

    startScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    pauseIndicator.classList.remove("visible");

    playStartSound();
}


/* ================================================================
   END GAME
================================================================ */

function endGame() {

    if (gameState !== GAME_STATE.RUNNING)
        return;

    gameState =
        GAME_STATE.GAME_OVER;

    updateHighScore();

    updateScore();

    finalScoreElement.textContent =
        "Score: " + Math.floor(score);

    finalHighScoreElement.textContent =
        "High Score: " + highScore;

    gameOverScreen.classList.remove("hidden");

    playGameOverSound();
}


/* ================================================================
   PAUSE
================================================================ */

function togglePause() {

    if (gameState !== GAME_STATE.RUNNING)
        return;

    paused = !paused;

    pauseIndicator.classList.toggle(
        "visible",
        paused
    );
}


/* ================================================================
   MAIN UPDATE
================================================================ */

function update(dt) {

    if (
        gameState !== GAME_STATE.RUNNING ||
        paused
    ) {
        return;
    }

    /*
        Prevent physics explosions when
        the browser tab loses focus.
    */

    dt = Math.min(dt, 0.035);

    updateDifficulty(dt);

    player.update(dt);

    updateObstacles(dt);

    updateGround(dt);

    updateBackground(dt);

    checkCollisions();

    /*
        Continuous score increase.
    */

    score += dt * 4;

    updateScore();
}


/* ================================================================
   RENDER
================================================================ */

function render() {

    drawBackground();

    /*
        Draw obstacles
    */

    for (const obstacle of obstacles) {

        drawObstacle(obstacle);
    }

    drawGround();

    player.draw();
}


/* ================================================================
   GAME LOOP
================================================================ */

function gameLoop(timestamp) {

    if (!lastTime) {

        lastTime = timestamp;
    }

    const dt =
        (timestamp - lastTime) / 1000;

    lastTime = timestamp;

    update(dt);

    render();

    requestAnimationFrame(gameLoop);
}


/* ================================================================
   RANDOM HELPER
================================================================ */

function random(min, max) {

    return Math.random() *
        (max - min) +
        min;
}


/* ================================================================
   WEB AUDIO SOUND SYSTEM
================================================================ */

let audioContext = null;


/*
    Create AudioContext only after user interaction.
*/

function initAudio() {

    if (!audioContext) {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (AudioCtx) {

            audioContext =
                new AudioCtx();
        }
    }

    if (
        audioContext &&
        audioContext.state === "suspended"
    ) {

        audioContext.resume();
    }
}


/*
    Generic oscillator sound.
*/

function playTone(
    frequency,
    duration,
    type = "square",
    volume = 0.04
) {

    if (!audioContext)
        return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/*
    Jump sound.
*/

function playJumpSound() {

    playTone(
        520,
        0.09,
        "square",
        0.035
    );
}


/*
    Start sound.
*/

function playStartSound() {

    playTone(
        330,
        0.08,
        "square",
        0.025
    );

    setTimeout(() => {

        playTone(
            660,
            0.1,
            "square",
            0.025
        );

    }, 80);
}


/*
    Game-over sound.
*/

function playGameOverSound() {

    if (!audioContext)
        return;

    playTone(
        260,
        0.15,
        "sawtooth",
        0.04
    );

    setTimeout(() => {

        playTone(
            180,
            0.25,
            "sawtooth",
            0.035
        );

    }, 120);
}


/* ================================================================
   KEYBOARD CONTROLS
================================================================ */

document.addEventListener(
    "keydown",
    event => {

        /*
            Prevent page scrolling when
            using Space / Arrow Up.
        */

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            initAudio();

            if (
                gameState === GAME_STATE.READY
            ) {

                startGame();

            } else if (
                gameState === GAME_STATE.RUNNING
            ) {

                player.jump();

            } else if (
                gameState === GAME_STATE.GAME_OVER
            ) {

                startGame();
            }

            return;
        }


        /*
            R = Restart
        */

        if (
            event.code === "KeyR" &&
            gameState === GAME_STATE.GAME_OVER
        ) {

            initAudio();

            startGame();

            return;
        }


        /*
            P = Pause
        */

        if (event.code === "KeyP") {

            togglePause();

            return;
        }
    }
);


/* ================================================================
   TOUCH CONTROLS
================================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        initAudio();

        if (
            gameState === GAME_STATE.READY
        ) {

            startGame();

        } else if (
            gameState === GAME_STATE.RUNNING
        ) {

            player.jump();

        } else if (
            gameState === GAME_STATE.GAME_OVER
        ) {

            startGame();
        }
    }
);


/* ================================================================
   BUTTON CONTROLS
================================================================ */

startButton.addEventListener(
    "click",
    () => {

        initAudio();

        startGame();
    }
);


restartButton.addEventListener(
    "click",
    () => {

        initAudio();

        startGame();
    }
);


/* ================================================================
   INITIALIZATION
================================================================ */

player.reset();

updateScore();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
